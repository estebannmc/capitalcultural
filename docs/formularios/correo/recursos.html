<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recursos del correo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@500;600;800&family=Geologica:wght@700&display=swap">
<style>
  /* Genera las imágenes PNG del correo: abrir con #logo o #banner y capturar con Chrome sin cabeza.
     Los clientes de correo no muestran SVG ni fuentes web: por eso el logo y el banner van como PNG. */
  html, body { margin: 0; background: transparent; }
  .v { display: none; }
  .v.on { display: block; }
  #logo svg { display: block; width: 214px; height: 42px; }
  .w { font: 700 21.88px "Geologica", "Arial Narrow", sans-serif; }
  #banner { position: relative; overflow: hidden; width: 600px; height: 150px; background: #002751; font-family: "Encode Sans", sans-serif; color: #fff; }
  #banner .foto { position: absolute; inset: 0 0 0 46%; background: url("https://www.santafeciudad.gov.ar/capitalcultural/wp-content/uploads/2025/06/15-noviembre-2024-SOMOS-Musica-1-1024x683.jpg") center 35% / cover; clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); }
  #banner .corte { position: absolute; top: 0; bottom: 0; left: calc(46% + 2.4%); width: 7px; background: #e63312; transform: skewX(-15deg); transform-origin: top; }
  #banner .txt { position: absolute; left: 5.5%; top: 50%; transform: translateY(-50%); display: grid; gap: 5px; }
  #banner .k { font-size: 8px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #57b8e9; }
  #banner .m { font-size: 32px; font-weight: 800; line-height: .95; }
  #banner .s { font-size: 11px; font-weight: 500; }
</style>
</head>
<body>
<div class="v" id="logo">
  <svg viewBox="0 0 163.36 32.07" preserveAspectRatio="xMinYMid slice" aria-hidden="true">
    <path fill="#002751" d="M12.15,0c-2.05,0-4.16,1.66-4.71,3.72L.04,31.29h37.08c2.05,0,4.16-1.66,4.71-3.72L49.23,0H12.15Z"/>
    <path fill="#fff" d="M17.86,23.73c-1.24,0-2.44-.19-3.61-.56-1.17-.38-2.16-.92-2.97-1.63l2.07-3.29c.3.35.71.66,1.22.93.51.27,1.05.47,1.64.62.58.15,1.13.22,1.66.22.59,0,1.08-.08,1.46-.25.38-.17.57-.41.57-.72s-.15-.55-.44-.75c-.29-.2-.84-.4-1.64-.6l-1.15-.31c-1.68-.46-2.88-1.09-3.6-1.91-.72-.81-1.08-1.78-1.08-2.89,0-.7.15-1.350.46-1.96.31-.6.73-1.13,1.28-1.59.55-.45,1.2-.81,1.94-1.06.74-.25,1.55-.38,2.42-.38,1.25,0,2.42.18,3.5.55,1.08.36,1.94.87,2.58,1.51l-2.14,3.21c-.26-.3-.59-.57-.99-.8-.41-.23-.85-.41-1.34-.55s-.98-.2-1.47-.2c-.39,0-.73.05-1.02.14-.29.09-.51.22-.67.38-.16.16-.24.34-.24.55,0,.18.07.34.2.45s.35.23.66.34c.31.11.72.24,1.24.4l1.13.33c1.68.49,2.89,1.1,3.63,1.82.74.72,1.11,1.65,1.11,2.8,0,1.02-.27,1.93-.8,2.71-.53.78-1.28,1.39-2.23,1.83-.96.44-2.08.66-3.36.66"/>
    <polygon fill="#fff" points="30.95 18.24 35.27 18.24 36.32 14.35 30.95 14.35 30.95 11.99 36.95 11.99 38.04 7.92 26.49 7.92 26.49 23.4 30.95 23.4 30.95 18.24"/>
    <polygon fill="#e63312" points="53.96 .07 45.59 31.36 50.1 31.36 58.46 .07 53.96 .07"/>
    <text class="w" x="59.13" y="23.41" fill="#002751">CULTURA</text>
  </svg>
</div>
<div class="v" id="banner">
  <div class="foto"></div><div class="corte"></div>
  <div class="txt"><span class="k">Orquestas infantiles y juveniles</span><span class="m">SOMOS MÚSICA</span><span class="s">Inscripción abierta · de 7 a 14 años</span></div>
</div>
<script>document.getElementById(location.hash.slice(1)).classList.add('on');</script>
</body>
</html>
