# WordPress local para probar el plugin de formularios. Solo para esta computadora: nada de esto va al servidor.
#   docker compose up -d          levanta el sitio en http://localhost:8080 y el correo de prueba en http://localhost:8025
#   sh instalar.sh                instala WordPress, Astra y el plugin (la primera vez)
#   docker compose down -v        borra todo
name: ccforms

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-local
      MARIADB_ROOT_PASSWORD: root-local
    volumes: [ "db:/var/lib/mysql" ]

  wordpress:
    image: wordpress:php8.1-apache
    depends_on: [ db ]
    ports: [ "8080:80" ]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local
      WORDPRESS_DB_NAME: wp
      WORDPRESS_TABLE_PREFIX: cc_   # El mismo prefijo que el sitio real.
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wp:/var/www/html
      - ../cc-forms:/var/www/html/wp-content/plugins/cc-forms
      - ./temas/completo/themes/astra:/var/www/html/wp-content/themes/astra
      - ./mailpit.php:/var/www/html/wp-content/mu-plugins/mailpit.php

  cli:
    image: wordpress:cli-php8.1
    profiles: [ "cli" ]
    user: "33:33"
    depends_on: [ wordpress ]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local
      WORDPRESS_DB_NAME: wp
      WORDPRESS_TABLE_PREFIX: cc_
    volumes:
      - wp:/var/www/html
      - ../cc-forms:/var/www/html/wp-content/plugins/cc-forms
      - ./temas/completo/themes/astra:/var/www/html/wp-content/themes/astra

  mailpit:
    image: axllent/mailpit:latest
    ports: [ "8025:8025" ]

volumes:
  db:
  wp:
