<style>
  .elementor-widget-html:has(.fd) > .elementor-widget-container { padding: 0; margin: 0; }
  .ast-container > .elementor:has(.fd) { flex: 1 1 100%; min-width: 0; }

  .fd {
    --azul: #002751;
    --celeste: #57b8e9;
    --rojo: #e63312;
    --gris-20: #dadad9;
    --gris-75: #606060;
    --inclinacion: -15deg;
    --degrade: linear-gradient(105deg, #57b8e9 0%, #2f86c0 38%, #10508a 72%, #002751 100%);
    color: var(--azul);
    font: 400 16px/1.6 "Encode Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-stretch: 100%;
    -webkit-font-smoothing: antialiased;
    max-width: 1120px; margin-inline: auto;
    padding-inline: clamp(16px, 4vw, 32px);
  }
  .fd *, .fd *::before, .fd *::after { box-sizing: border-box; }
  .fd :is(h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote) { margin: 0; padding: 0; }
  .fd :is(ul, ol) { list-style: none; }
  .fd img { display: block; max-width: 100%; height: auto; border-radius: 0; }
  .fd :is(h2, h3, h4) { color: inherit; font-family: inherit; text-transform: none; letter-spacing: normal; }

  .fd [id] { scroll-margin-top: 104px; }

  .fd a:not([class]) {
    color: var(--azul); text-decoration: underline; text-decoration-color: var(--rojo);
    text-decoration-thickness: 2px; text-underline-offset: .22em;
  }
  .fd a:is(:hover, :focus) { color: var(--azul); }
  .fd a:focus-visible, .fd summary:focus-visible, .fd button:focus-visible, .fd input:focus-visible {
    outline: 0; box-shadow: 0 0 0 2px #fff, 0 0 0 5px var(--rojo); border-radius: 4px;
  }

  .fd .fd-barra {
    display: inline-block; flex: none; width: .2em; height: .78em;
    background: var(--rojo); transform: skewX(var(--inclinacion));
  }
  .fd .fd-titulo {
    display: flex; align-items: baseline; gap: 0 .6em;
    margin-bottom: clamp(14px, 2vw, 20px);
    font-size: clamp(1.5em, 2.8vw, 2.1em); font-weight: 700; line-height: 1.15; letter-spacing: -.01em;
  }
  .fd .fd-titulo .fd-barra { align-self: center; margin-right: .2em; }

  .fd .fd-seccion { display: grid; gap: 1em; }
  .fd :is(.fd-texto, .fd-lead) { text-align: justify; text-align-last: left; -webkit-hyphens: auto; hyphens: auto; }
  @media (max-width: 700px) {
    .fd :is(.fd-texto, .fd-lead) { text-align: left; }
  }
  .fd .fd-texto { display: grid; gap: 1em; font-size: 1.05em; }
  .fd .fd-lead { font-size: clamp(1.1em, 1.8vw, 1.3em); font-weight: 600; line-height: 1.45; }
  .fd .fd-nota { color: var(--gris-75); font-size: .95em; }
  .fd .fd-cierre { text-align: center; font-size: 1.05em; }

  .fd .fd-vidrio {
    border-radius: 8px;
    background: linear-gradient(160deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .56));
    -webkit-backdrop-filter: blur(16px) saturate(160%);
            backdrop-filter: blur(16px) saturate(160%);
    box-shadow:
      0 1px 1px rgba(0, 39, 81, .04),
      0 14px 30px -16px rgba(0, 39, 81, .3),
      inset 0 1px 0 rgba(255, 255, 255, .9);
  }

  .fd .fd-tarjetas { display: grid; gap: clamp(12px, 1.6vw, 18px); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

  .fd .fd-tarjetas--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fd .fd-tarjetas--2 > .fd-tarjeta {
    display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: .6em; align-content: start;
  }
  @media (max-width: 600px) {
    .fd .fd-tarjetas--2 { grid-template-columns: minmax(0, 1fr); }
  }
  .fd .fd-tarjeta {
    position: relative; overflow: hidden; display: flex; flex-direction: column; gap: .5em;
    padding: clamp(18px, 2.4vw, 24px); color: var(--azul); text-decoration: none;
    transition: transform .3s cubic-bezier(.16, 1, .3, 1), box-shadow .3s ease;
  }
  .fd .fd-tarjeta::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--degrade); }
  .fd .fd-tarjeta h3 { font-size: 1.12em; font-weight: 700; line-height: 1.25; }
  .fd .fd-tarjeta p { font-size: .97em; line-height: 1.5; }
  .fd .fd-tarjeta .fd-meta { margin-top: auto; padding-top: .35em; color: var(--gris-75); font-size: .88em; }
  .fd .fd-tarjeta .fd-flecha { margin-top: auto; padding-top: .35em; font-weight: 600; text-decoration: underline; text-decoration-color: var(--rojo); text-decoration-thickness: 2px; text-underline-offset: .22em; }
  .fd a.fd-tarjeta:hover { transform: translateY(-4px); box-shadow: 0 1px 1px rgba(0, 39, 81, .04), 0 22px 36px -18px rgba(0, 39, 81, .45), inset 0 1px 0 rgba(255, 255, 255, .9); }
  .fd .fd-icono { width: 28px; height: 28px; color: var(--azul); flex: none; }

  .fd .fd-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    min-height: 44px; padding: 0 18px; border-radius: 6px;
    font-weight: 600; font-size: 15px; line-height: 1.2; text-decoration: none;
    color: var(--azul); background: rgba(255, 255, 255, .9); box-shadow: inset 0 0 0 2px var(--azul);
    transition: background .25s ease;
  }
  .fd .fd-btn:hover { background: #fff; }
  .fd .cb-btn { min-height: 44px; padding: 0 20px; }
  .fd .cb-btn span { font-size: 15px; }

  .fd-menu { padding-block: clamp(20px, 3vw, 28px) clamp(28px, 4vw, 44px); }
  .fd-menu ul {
    display: flex; justify-content: center; gap: 4px; padding: 6px;
    width: fit-content; max-width: 100%; margin-inline: auto;
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .fd-menu ul::-webkit-scrollbar { display: none; }
  .fd-menu li { flex: none; scroll-snap-align: center; }
  .fd-menu a {
    position: relative; display: block; padding: 10px 16px; border-radius: 6px;
    color: var(--azul); font-size: .95em; font-weight: 500; text-decoration: none; white-space: nowrap;
    transition: background .2s ease;
  }
  .fd-menu a:hover { background: rgba(87, 184, 233, .2); }
  .fd-menu a[aria-current="page"] { font-weight: 700; }
  .fd-menu a[aria-current="page"]::after {
    content: ""; position: absolute; left: 16px; right: 16px; bottom: 4px; height: 3px;
    background: var(--rojo); transform: skewX(var(--inclinacion));
  }
  @media (max-width: 700px) {
    .fd-menu ul { justify-content: flex-start; width: auto; }
    .fd-menu a { padding: 10px 12px; font-size: .9em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fd *, .fd *::before, .fd *::after { transition: none !important; animation: none !important; }
    .fd a.fd-tarjeta:hover { transform: none; }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .fd .fd-vidrio { background: rgba(255, 255, 255, .95); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .fd .fd-vidrio { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
</style>

<style>
  /* Pista para deslizar (el mismo bloque en la home y en Festival Diseña): en las filas que se
     deslizan de costado, un degradé en el borde que tiene más y, una sola vez, una mano que desliza
     mientras los botones se corren y vuelven. Sin librerías: SVG y animaciones de CSS. */
  .pista-caja { position: relative; }
  .pista-der { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); }
  .pista-izq { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px); mask-image: linear-gradient(90deg, transparent, #000 44px); }
  .pista-izq.pista-der {
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent);
    mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent);
  }
  .pista-empujon > * { animation: pista-empujon 1.7s cubic-bezier(.45, 0, .25, 1) 2; }
  .pista-mano {
    position: absolute; right: 26px; z-index: 3; width: 54px; height: 62px; pointer-events: none;
    filter: drop-shadow(0 4px 8px rgba(0, 39, 81, .35));
    animation: pista-mano 1.7s cubic-bezier(.45, 0, .25, 1) 2 both;
  }
  .pista-mano svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pista-toque { transform-origin: 22px 5px; animation: pista-toque 1.7s ease-out 2 both; }
  /* La estela sale del dedo hacia la derecha mientras la mano va a la izquierda. */
  .pista-estela { transform-origin: 22px 5px; animation: pista-estela 1.7s cubic-bezier(.45, 0, .25, 1) 2 both; }
  @keyframes pista-mano {
    0% { opacity: 0; transform: translateX(8px) rotate(8deg); }
    14% { opacity: 1; transform: translateX(0) rotate(0); }
    24% { transform: translateX(0) scale(.92); }
    68% { opacity: 1; transform: translateX(-76px) rotate(-6deg) scale(.92); }
    84%, 100% { opacity: 0; transform: translateX(-84px) rotate(-6deg); }
  }
  @keyframes pista-toque {
    0%, 18% { opacity: 0; transform: scale(.3); }
    26% { opacity: .55; }
    52%, 100% { opacity: 0; transform: scale(1.7); }
  }
  @keyframes pista-estela {
    0%, 24% { opacity: 0; transform: scaleX(0); }
    30% { opacity: .9; }
    68% { opacity: .9; transform: scaleX(1); }
    84%, 100% { opacity: 0; transform: scaleX(1); }
  }
  @keyframes pista-empujon {
    0%, 24% { transform: none; }
    62% { transform: translateX(-40px); }
    90%, 100% { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pista-mano { display: none; }
    .pista-empujon > * { animation: none; }
  }
</style>

<script>
  // Marca con degradé el lado de la fila que tiene más. Con «conMano», la primera vez que la fila
  // entra entera en pantalla y desborda, muestra la mano y corre los botones. No vuelve a aparecer
  // en este navegador desde que la persona toca o desliza esa fila.
  window.pistaDeslizar = window.pistaDeslizar || function (fila, clave, conMano) {
    var guardada = 'pista-' + clave;
    var mano = null;
    var bordes = function () {
      var resto = fila.scrollWidth - fila.clientWidth;
      fila.classList.toggle('pista-izq', resto > 4 && fila.scrollLeft > 4);
      fila.classList.toggle('pista-der', resto > 4 && fila.scrollLeft < resto - 4);
      return resto > 4;
    };
    var aprendida = function () { try { return localStorage.getItem(guardada) === '1'; } catch (e) { return false; } };
    var cortar = function () {
      fila.classList.remove('pista-empujon');
      if (mano) { mano.remove(); mano = null; }
    };
    var aprender = function () {
      cortar();
      try { localStorage.setItem(guardada, '1'); } catch (e) {}
    };
    fila.addEventListener('scroll', bordes, { passive: true });
    fila.addEventListener('touchstart', aprender, { passive: true });
    fila.addEventListener('wheel', aprender, { passive: true });
    window.addEventListener('resize', bordes);
    bordes();
    if (!conMano || aprendida() || !('IntersectionObserver' in window) ||
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var obs = new IntersectionObserver(function (vistas) {
      if (!vistas[0].isIntersecting || !bordes() || aprendida()) return;
      obs.disconnect();
      var caja = fila.parentNode;
      caja.classList.add('pista-caja');
      mano = document.createElement('span');
      mano.className = 'pista-mano';
      mano.setAttribute('aria-hidden', 'true');
      mano.innerHTML = '<svg viewBox="0 0 50 58"><defs><linearGradient id="pista-g"><stop offset="0" stop-color="#57b8e9"/>' +
        '<stop offset="1" stop-color="#57b8e9" stop-opacity="0"/></linearGradient></defs>' +
        '<rect class="pista-estela" x="22" y="1.5" width="70" height="7" rx="3.5" fill="url(#pista-g)"/>' +
        '<circle class="pista-toque" cx="22" cy="5" r="10" fill="#57b8e9"/>' +
        '<path d="M18 33V9a4 4 0 0 1 8 0v15a3.5 3.5 0 0 1 7 0v2a3.5 3.5 0 0 1 7 0v3a3.5 3.5 0 0 1 7 0v13c0 7-5 12-12 12h-5c-5 0-8-2-11-6l-7.5-10.5a3.6 3.6 0 0 1 5.7-4.4z" ' +
        'fill="#fff" stroke="#002751" stroke-width="2.5" stroke-linejoin="round"/></svg>';
      // La punta del dedo queda a la altura del centro de la fila.
      mano.style.top = (fila.offsetTop + fila.offsetHeight / 2 - 6) + 'px';
      caja.appendChild(mano);
      fila.classList.add('pista-empujon');
      mano.addEventListener('animationend', function (e) { if (e.target === mano) cortar(); });
    }, { threshold: 0.9 });
    obs.observe(fila);
  };
</script>
<script>
  document.querySelectorAll('.fd-menu ul').forEach(function (ul) { pistaDeslizar(ul, 'disena-menu', true); });
</script>
